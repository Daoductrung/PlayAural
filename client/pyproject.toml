[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playaural-client"
version = "1.0.5.1"
description = "PlayAural Game Client"
requires-python = ">=3.11"
dependencies = [
    "wxPython>=4.2.0",
    "accessible-output2>=0.16",
    "websockets>=10.0",
    "fluent-runtime>=0.4.0",
    "requests",
    "psutil",
    "keyring>=24.0",
    "livekit>=1.1.5",
    "numpy>=1.26",
    "sounddevice>=0.5.5",
    "cosmos",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
]

[project.scripts]
playaural-client = "client:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
cosmos = { path = "vendor/cosmos-0.3.1-cp311-abi3-win_amd64.whl" }
