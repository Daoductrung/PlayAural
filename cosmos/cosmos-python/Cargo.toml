[package]
name = "cosmos-python"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Cosmos audio game library"

[lib]
name = "cosmos"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: one wheel serves CPython 3.11 and later.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
cosmos-audio = { path = "../cosmos-audio" }
cosmos-screenreader = { path = "../cosmos-screenreader" }
cosmos-window = { path = "../cosmos-window" }
