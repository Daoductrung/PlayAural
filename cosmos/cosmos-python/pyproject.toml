[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "cosmos"
version = "0.3.1"
description = "Audio game library with 3D spatial audio and screen reader support"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
features = ["pyo3/extension-module"]
# Bundle the Steam Audio runtime DLL next to the extension and retain its
# license, third-party, trademark, and provenance documents in package data.
include = [
    { path = "phonon.dll", from = "out-dir", to = "cosmos/" },
    { path = "steam_audio/LICENSE.md", from = "out-dir", to = "cosmos/third_party/" },
    { path = "steam_audio/THIRDPARTY.md", from = "out-dir", to = "cosmos/third_party/" },
    { path = "steam_audio/TRADEMARK_RIGHTS.md", from = "out-dir", to = "cosmos/third_party/" },
    { path = "steam_audio/UPSTREAM.json", from = "out-dir", to = "cosmos/third_party/" },
]
