[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "cosmos"
version = "0.2.0"
description = "Audio game library with 3D spatial audio and screen reader support"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.maturin]
features = ["pyo3/extension-module"]
# Bundle the Steam Audio runtime DLL next to the compiled extension. build.rs
# stages phonon.dll into OUT_DIR; maturin installs the extension as
# cosmos/cosmos.pyd, so we drop the DLL into the `cosmos/` package dir alongside
# it — that puts it on the extension's DLL search path at import time.
include = [{ path = "phonon.dll", from = "out-dir", to = "cosmos/" }]
